<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Modelly</title>
    <script>
      // Redirect deep links to the SPA entry point, preserving the path.
      // Pairs with the sessionStorage read in src/main.jsx.
      //
      // The base is hardcoded because this is a plain static file — no Vite
      // env. Keep it in sync with vite.config.js `base` and lib/site.js at the
      // modelly.ca cutover.
      var base = "/modelly/";
      var path = window.location.pathname.slice(base.length);
      sessionStorage.setItem("redirectPath", path + window.location.search);
      window.location.replace(base);
    </script>
  </head>
  <body></body>
</html>
