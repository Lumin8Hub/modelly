name: Deploy to GitHub Pages

on:
  push:
    branches: [main, v2]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v1
        uses: actions/checkout@v4
        with:
          ref: main
          path: v1
      - name: Checkout v2
        uses: actions/checkout@v4
        with:
          ref: v2
          path: v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build v1
        working-directory: v1
        run: npm ci && npm run build
      - name: Build v2
        working-directory: v2
        run: npm ci && VITE_BASE=/modelly/v2/ VITE_PREVIEW=true npm run build
      - name: Assemble site
        run: |
          mkdir -p site
          cp -r v1/dist/. site/
          mkdir -p site/v2
          cp -r v2/dist/. site/v2/
          cp v2/dist/404.html site/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
