<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="canonical" href="https://lumin8hub.github.io/modelly/" />
    <meta name="theme-color" content="#0B0C0E" />

    <title>Modelly — spend less time producing numbers, more time using them</title>
    <meta
      name="description"
      content="Modelly builds planning, forecasting and reporting systems in Microsoft 365 or Google Workspace so finance teams stop spending 80% of their time on preparation."
    />

    <!-- Open Graph. A referral link pasted into email or LinkedIn must not
         preview as a bare URL. Absolute URLs are required: Vite rewrites href
         and src for the base path, but never <meta content>. The Seo component
         overrides title, description and url per route.
         See docs/revision-plan/02-architecture.md §6.3. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Modelly" />
    <meta
      property="og:title"
      content="Modelly — spend less time producing numbers, more time using them"
    />
    <meta
      property="og:description"
      content="Modelly builds planning, forecasting and reporting systems in Microsoft 365 or Google Workspace so finance teams stop spending 80% of their time on preparation."
    />
    <meta property="og:url" content="https://lumin8hub.github.io/modelly/" />
    <meta property="og:image" content="https://lumin8hub.github.io/modelly/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Modelly — spend less time producing numbers, more time using them"
    />
    <meta
      name="twitter:description"
      content="Modelly builds planning, forecasting and reporting systems in Microsoft 365 or Google Workspace so finance teams stop spending 80% of their time on preparation."
    />
    <meta name="twitter:image" content="https://lumin8hub.github.io/modelly/og-default.png" />

    <!-- No aggregateRating, review or employee list: no approved reviews exist,
         and marking up unapproved bios carries the same exposure as publishing
         them. See 02-architecture.md §6.4. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Modelly",
        "url": "https://lumin8hub.github.io/modelly/",
        "description": "Financial and operational planning, forecasting and reporting systems built in Microsoft 365 or Google Workspace.",
        "areaServed": [
          { "@type": "AdministrativeArea", "name": "Ontario, Canada" },
          { "@type": "Place", "name": "Remote" }
        ],
        "knowsAbout": [
          "Financial planning and analysis",
          "Month-end close",
          "Forecasting",
          "Management reporting",
          "Process re-engineering"
        ],
        "sameAs": ["https://www.linkedin.com/company/modelly"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
